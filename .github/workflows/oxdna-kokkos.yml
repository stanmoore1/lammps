# Build the oxDNA-Kokkos standalones (bench/oxdna_kokkos, CUDA-faithful, and
# bench/oxdna_kokkos_lammps, LAMMPS-faithful) with the Serial Kokkos backend
# and run their self-checking validation suites (finite-difference forces &
# torques, NVE energy conservation, and thermostat temperature) for oxDNA1,
# oxDNA2 and oxDNA3. The suites exit non-zero on any failure.
name: "oxDNA-Kokkos tests"

on:
  push:
    paths:
      - 'bench/oxdna_kokkos/**'
      - 'bench/oxdna_kokkos_lammps/**'
      - 'lib/kokkos/**'
      - '.github/workflows/oxdna-kokkos.yml'
  pull_request:
    paths:
      - 'bench/oxdna_kokkos/**'
      - 'bench/oxdna_kokkos_lammps/**'
      - '.github/workflows/oxdna-kokkos.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & validate (Serial)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ ninja-build

      - name: Configure
        working-directory: bench/oxdna_kokkos
        run: |
          cmake -B build -G Ninja \
            -DKokkos_ENABLE_SERIAL=ON \
            -DOXDNA_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: bench/oxdna_kokkos
        run: cmake --build build -j

      - name: Run validation suite (oxDNA1 + oxDNA2 + oxDNA3)
        working-directory: bench/oxdna_kokkos
        run: ./build/fd_test

      # The LAMMPS-faithful bench uses the oxDNA3 parameter file of
      # bench/oxdna_kokkos/params (no copy of its own).
      - name: Configure (LAMMPS-faithful bench)
        working-directory: bench/oxdna_kokkos_lammps
        run: |
          cmake -B build -G Ninja \
            -DKokkos_ENABLE_SERIAL=ON \
            -DOXDNA_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build (LAMMPS-faithful bench)
        working-directory: bench/oxdna_kokkos_lammps
        run: cmake --build build -j

      - name: Run validation suite (LAMMPS-faithful bench, oxDNA1 + oxDNA2 + oxDNA3)
        working-directory: bench/oxdna_kokkos_lammps
        run: ./build/fd_test
