name: Extract LAMMPS Knowledge

on:
  workflow_dispatch:

jobs:
  extract-lammps:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-sphinx
          pip install markdown beautifulsoup4

      - name: Clone LAMMPS Repository
        run: |
          git clone --single-branch --depth=1 https://github.com/lammps/lammps.git docs_sources/lammps

      - name: Build LAMMPS Docs
        run: |
          cd docs_sources/lammps/doc
          make html
          cd -

      - name: Extract to JSONL
        run: |
          python - <<'EOF'
          import os, json
          from pathlib import Path
          from bs4 import BeautifulSoup

          def extract_html_text(html_path):
              with open(html_path, encoding="utf-8") as f:
                  soup = BeautifulSoup(f, "html.parser")
              title = soup.title.string if soup.title else html_path.name
              text = soup.get_text("\n", strip=True)
              return {"title": title, "path": str(html_path), "content": text}

          def extract_plain_text(path):
              with open(path, encoding="utf-8", errors="ignore") as f:
                  text = f.read()
              title = os.path.basename(path)
              return {"title": title, "path": str(path), "content": text}

          output_dir = Path("extracted_docs")
          output_dir.mkdir(exist_ok=True)
          out_path = output_dir / "lammps-gpt-lammps.jsonl"

          with open(out_path, "w", encoding="utf-8") as fout:
              for base_dir in [
                  Path("docs_sources/lammps/doc/html"),
                  Path("docs_sources/lammps/src"),
                  Path("docs_sources/lammps/examples")
              ]:
                  for root, _, files in os.walk(base_dir):
                      for file in files:
                          path = Path(root) / file
                          try:
                              if path.suffix == ".html":
                                  record = extract_html_text(path)
                              elif path.suffix in [".cpp", ".h", ".c", ".f", ".txt"]:
                                  record = extract_plain_text(path)
                              else:
                                  continue
                              fout.write(json.dumps(record) + "\n")
                          except Exception as e:
                              print(f"Failed on {path}: {e}")

          print(f"Wrote {out_path}")
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-lammps
          path: extracted_docs/lammps-gpt-lammps.jsonl
          retention-days: 30
