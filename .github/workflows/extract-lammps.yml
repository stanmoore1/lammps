name: Extract LAMMPS Knowledge

on:
  workflow_dispatch:

jobs:
  extract-lammps:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen python3-sphinx
          pip install markdown beautifulsoup4

      - name: Clone LAMMPS Repository
        run: |
          git clone --single-branch --depth=1 https://github.com/lammps/lammps.git docs_sources/lammps

      - name: Build LAMMPS Docs
        run: |
          cd docs_sources/lammps/doc
          make html
          cd -

      - name: Extract Selected Files to JSONL
        run: |
          python - <<'EOF'
          import os, json
          from pathlib import Path
          from bs4 import BeautifulSoup

          def extract_html(path):
              with open(path, encoding="utf-8") as f:
                  soup = BeautifulSoup(f, "html.parser")
              title = soup.title.string.strip() if soup.title else path.name
              text = soup.get_text("\n", strip=True)
              return {"title": title, "path": str(path), "content": text}

          def extract_text(path):
              with open(path, encoding="utf-8", errors="ignore") as f:
                  return {"title": path.name, "path": str(path), "content": f.read()}

          output_dir = Path("extracted_docs")
          output_dir.mkdir(exist_ok=True)
          out_path = output_dir / "lammps-gpt-lammps.jsonl"

          with open(out_path, "w", encoding="utf-8") as fout:
              # Extract HTML from doc/html
              for root, _, files in os.walk("docs_sources/lammps/doc/html"):
                  for file in files:
                      if file.endswith(".html"):
                          path = Path(root) / file
                          try:
                              record = extract_html(path)
                              fout.write(json.dumps(record) + "\n")
                          except Exception as e:
                              print(f"Failed on {path}: {e}")

              # Extract *.h and *.cpp from src
              for root, _, files in os.walk("docs_sources/lammps/src"):
                  for file in files:
                      if file.endswith(".h") or file.endswith(".cpp"):
                          path = Path(root) / file
                          try:
                              record = extract_text(path)
                              fout.write(json.dumps(record) + "\n")
                          except Exception as e:
                              print(f"Failed on {path}: {e}")

              # Extract README and in.* from examples
              for root, _, files in os.walk("docs_sources/lammps/examples"):
                  for file in files:
                      if file.startswith("README") or file.startswith("in."):
                          path = Path(root) / file
                          try:
                              record = extract_text(path)
                              fout.write(json.dumps(record) + "\n")
                          except Exception as e:
                              print(f"Failed on {path}: {e}")

          print(f"Wrote {out_path}")
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-lammps
          path: extracted_docs/lammps-gpt-lammps.jsonl
          retention-days: 30
