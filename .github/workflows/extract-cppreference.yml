name: Extract CppReference Knowledge

on:
  workflow_dispatch:

jobs:
  extract-cppreference:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          pip install beautifulsoup4 html5lib

      - name: Download and Unpack CppReference HTML Book
        run: |
          mkdir -p docs_sources/cppreference-doc
          wget -q https://upload.cppreference.com/mwiki/images/1/16/html_book_20190607.tar.xz
          tar -xf html_book_20190607.tar.xz -C docs_sources/cppreference-doc --strip-components=1

      - name: Extract CppReference HTML to JSONL
        run: |
          python - <<'EOF'
          import os, json
          from pathlib import Path
          from bs4 import BeautifulSoup

          base_dir = Path("docs_sources/cppreference-doc")
          output_dir = Path("extracted_docs")
          output_dir.mkdir(exist_ok=True)
          output_path = output_dir / "lammps-gpt-cppreference.jsonl"

          def clean(elem):
              return elem.get_text("\n", strip=True).strip()

          def extract_chunks(html_path):
              with open(html_path, encoding="utf-8", errors="ignore") as f:
                  soup = BeautifulSoup(f, "html5lib")

              body = soup.find("body")
              if not body: return []

              title = soup.title.string.strip() if soup.title else html_path.name
              chunks = []
              section_id = 0

              for tag in body.find_all(True, recursive=True):
                  if tag.name in ["h1", "h2", "h3", "h4", "h5"]:
                      section_title = clean(tag)
                      section_level = tag.name
                      section_id += 1
                      content_parts, code_blocks = [], []
                      sib = tag.find_next_sibling()
                      while sib and sib.name not in ["h1", "h2", "h3", "h4", "h5"]:
                          if sib.name in ["p", "div", "li", "table", "dl", "ul", "ol"]:
                              content_parts.append(clean(sib))
                          elif sib.name == "pre":
                              code_blocks.append(sib.get_text(strip=True))
                          sib = sib.find_next_sibling()

                      content = "\n\n".join(content_parts).strip()
                      if content or code_blocks:
                          chunks.append({
                              "source": "cppreference",
                              "title": title,
                              "path": str(html_path.relative_to(base_dir)),
                              "section": section_title,
                              "level": section_level,
                              "content": content,
                              "code": code_blocks
                          })

              return chunks

          with open(output_path, "w", encoding="utf-8") as fout:
              for root, _, files in os.walk(base_dir):
                  for file in files:
                      if file.endswith(".html"):
                          full_path = Path(root) / file
                          try:
                              for chunk in extract_chunks(full_path):
                                  fout.write(json.dumps(chunk, ensure_ascii=False) + "\n")
                              print(f"Done {full_path}.")
                          except Exception as e:
                              print(f"Error in {full_path}: {e}")

          print(f"Wrote {output_path}")
          EOF

      - name: Upload CppReference Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-cppreference
          path: extracted_docs/lammps-gpt-cppreference.jsonl
          retention-days: 30
