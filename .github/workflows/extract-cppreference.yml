name: Extract CppReference Knowledge

on:
  workflow_dispatch:

jobs:
  extract-cppreference:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          pip install beautifulsoup4 html5lib

      - name: Download and Unpack CppReference HTML Archive
        run: |
          mkdir -p docs_sources/cppreference-doc
          wget -q https://upload.cppreference.com/mwiki/images/1/16/html_book_20190607.tar.xz
          tar -xf html_book_20190607.tar.xz -C docs_sources/cppreference-doc --strip-components=1

      - name: Extract Full HTML Articles to JSONL
        run: |
          python - <<'EOF'
          import os, json
          from pathlib import Path
          from bs4 import BeautifulSoup

          input_dir = Path("docs_sources/cppreference-doc")
          output_dir = Path("extracted_docs")
          output_dir.mkdir(exist_ok=True)
          output_file = output_dir / "lammps-gpt-cppreference.jsonl"

          def extract_article(path):
              with open(path, encoding="utf-8", errors="ignore") as f:
                  soup = BeautifulSoup(f, "html5lib")

              title = soup.title.string.strip() if soup.title else path.name
              body = soup.find("div", {"id": "mw-content-text"})
              if not body:
                  return None

              text_parts = []
              code_blocks = []

              for tag in body.descendants:
                  if tag.name in ["p", "li"]:
                      text_parts.append(tag.get_text(" ", strip=True))
                  elif tag.name in ["pre", "code"]:
                      code = tag.get_text("\n", strip=True)
                      if code:
                          code_blocks.append(code)
                  elif tag.name in ["dl", "table"]:
                      text_parts.append(tag.get_text(" ", strip=True))

              content = "\n\n".join(p for p in text_parts if p)
              return {
                  "source": "cppreference",
                  "title": title,
                  "path": str(path),
                  "content": content.strip(),
                  "code": code_blocks
              }

          with open(output_file, "w", encoding="utf-8") as fout:
              for root, _, files in os.walk(input_dir):
                  for file in files:
                      if file.endswith(".html"):
                          path = Path(root) / file
                          try:
                              record = extract_article(path)
                              if record and record["content"]:
                                  fout.write(json.dumps(record) + "\n")
                          except Exception as e:
                              print(f"Failed on {path}: {e}")

          print(f"Wrote {output_file}")
          EOF

      - name: Upload CppReference Knowledge Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-cppreference
          path: extracted_docs/lammps-gpt-cppreference.jsonl
          retention-days: 30
