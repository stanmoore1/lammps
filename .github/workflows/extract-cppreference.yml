name: Extract CppReference Knowledge

on:
  workflow_dispatch:

jobs:
  extract-cppreference:
    runs-on: ubuntu-latest

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          pip install beautifulsoup4 html5lib

      - name: Download and Unpack CppReference Archive
        run: |
          mkdir -p docs_sources/cppreference-doc
          wget -q https://upload.cppreference.com/mwiki/images/1/16/html_book_20190607.tar.xz
          tar -xf html_book_20190607.tar.xz -C docs_sources/cppreference-doc --strip-components=1

      - name: Extract Rich HTML to JSONL
        run: |
          python - <<'EOF'
          import os, json, re
          from pathlib import Path
          from bs4 import BeautifulSoup

          base_dir = Path("docs_sources/cppreference-doc")
          output_dir = Path("extracted_docs")
          output_dir.mkdir(exist_ok=True)
          output_path = output_dir / "lammps-gpt-cppreference.jsonl"

          def slugify(text):
              return re.sub(r'\W+', '_', text.strip().lower())

          def clean_text(elem):
              return elem.get_text("\n", strip=True)

          def extract_tables(tag):
              tables = []
              for table in tag.find_all("table"):
                  rows = []
                  for tr in table.find_all("tr"):
                      cells = [clean_text(td) for td in tr.find_all(["td", "th"])]
                      rows.append(cells)
                  tables.append(rows)
              return tables

          def extract_dl(tag):
              dl_content = []
              for dl in tag.find_all("dl"):
                  for dt in dl.find_all("dt"):
                      dd = dt.find_next_sibling("dd")
                      if dd:
                          dl_content.append(f"**{clean_text(dt)}**: {clean_text(dd)}")
              return dl_content

          def extract_chunks(html_path):
              with open(html_path, encoding="utf-8", errors="ignore") as f:
                  soup = BeautifulSoup(f, "html5lib")
              body = soup.find("body")
              if not body:
                  return []

              title = soup.title.string.strip() if soup.title else html_path.name
              breadcrumbs = [li.get_text(strip=True) for li in soup.select(".breadcrumbs li")]

              chunks = []
              headers = body.find_all(["h1", "h2", "h3", "h4", "h5", "h6"])
              for i, header in enumerate(headers):
                  section = clean_text(header)
                  level = header.name
                  content_parts = []
                  code_blocks = []
                  tables = []
                  dl_defs = []

                  next_node = header.find_next_sibling()
                  while next_node and next_node.name not in ["h1", "h2", "h3", "h4", "h5", "h6"]:
                      if next_node.name == "p":
                          content_parts.append(clean_text(next_node))
                      elif next_node.name in ["ul", "ol"]:
                          content_parts.append(clean_text(next_node))
                      elif next_node.name == "pre":
                          code_blocks.append(next_node.get_text(strip=True))
                      elif next_node.name == "table":
                          tables += extract_tables(next_node)
                      elif next_node.name == "dl":
                          dl_defs += extract_dl(next_node)
                      next_node = next_node.find_next_sibling()

                  content = "\n\n".join(content_parts + dl_defs).strip()
                  if content or code_blocks or tables:
                      chunks.append({
                          "uid": f"cppreference::{slugify(str(html_path.relative_to(base_dir)) + '::' + section)}",
                          "source": "cppreference",
                          "title": title,
                          "path": str(html_path.relative_to(base_dir)),
                          "section": section,
                          "level": level,
                          "breadcrumbs": breadcrumbs,
                          "content": content,
                          "code": code_blocks,
                          "tables": tables
                      })
              return chunks

          with open(output_path, "w", encoding="utf-8") as fout:
              for root, _, files in os.walk(base_dir):
                  for file in files:
                      if file.endswith(".html"):
                          path = Path(root) / file
                          try:
                              for chunk in extract_chunks(path):
                                  fout.write(json.dumps(chunk) + "\n")
                          except Exception as e:
                              print(f"Failed on {path}: {e}")

          print(f"Wrote {output_path}")
          EOF

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-cppreference
          path: extracted_docs/lammps-gpt-cppreference.jsonl
          retention-days: 30
