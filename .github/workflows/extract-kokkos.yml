name: Extract Kokkos Core Wiki Knowledge

on:
  workflow_dispatch:

jobs:
  extract-kokkos-core:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kokkos-core-wiki
        uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos-core-wiki
          path: kokkos-core-wiki

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd kokkos-core-wiki
          pip install --upgrade pip
          pip install -r build_requirements.txt
          pip install beautifulsoup4 html5lib

      - name: Build HTML docs
        run: |
          cd kokkos-core-wiki/docs
          make html

      - name: List generated HTML files
        run: |
          find kokkos-core-wiki/docs/generated_docs -type f -name "*.html" | wc -l
          find kokkos-core-wiki/docs/generated_docs -type f -name "*.html" | head -n 10


      - name: Convert HTML to knowledge.jsonl
        shell: python
        run: |
          import os, json
          from bs4 import BeautifulSoup

          docs_dir = "kokkos-core-wiki/docs/generated_docs"
          output_path = "kokkos-core-knowledge/knowledge.jsonl"
          os.makedirs("kokkos-core-knowledge", exist_ok=True)

          lines = []
          for root, _, files in os.walk(docs_dir):
              for file in files:
                  if file.endswith(".html"):
                      full_path = os.path.join(root, file)
                      with open(full_path, "r", encoding="utf-8") as f:
                          soup = BeautifulSoup(f, "html5lib")
                          article = soup.find("article", {"role": "main"})
                          if article:
                              text = article.get_text(" ", strip=True)
                              text = text.replace("\u200b", " ").replace("\xa0", " ")
                              if len(text) > 100:
                                  title = soup.title.string.strip() if soup.title else file
                                  lines.append(json.dumps({
                                      "title": title,
                                      "text": text,
                                      "source": os.path.relpath(full_path, "kokkos-core-wiki")
                                  }))

          with open(output_path, "w", encoding="utf-8") as out:
              out.write("\n".join(lines))
              
      - name: Show knowledge.jsonl size and preview
        run: |
          wc -l kokkos-core-knowledge/knowledge.jsonl
          head -n 1 kokkos-core-knowledge/knowledge.jsonl

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokkos-core-html
          path: kokkos-core-wiki/docs/generated_docs

      - name: Upload Knowledge JSONL
        uses: actions/upload-artifact@v4
        with:
          name: kokkos-core-knowledge
          path: kokkos-core-knowledge/knowledge.jsonl
