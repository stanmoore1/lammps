name: Extract Kokkos Core Knowledge

on:
  workflow_dispatch:

jobs:
  extract-kokkos-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kokkos Core Wiki
        uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos-core-wiki
          path: kokkos-core-wiki

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          cd kokkos-core-wiki
          pip install --upgrade pip
          pip install -r build_requirements.txt
          pip install beautifulsoup4 html5lib

      - name: Build Kokkos HTML Docs
        run: |
          cd kokkos-core-wiki/docs
          make html

      - name: Extract HTML to JSONL
        run: |
          python <<'EOF'
          import os, json
          from bs4 import BeautifulSoup
          from pathlib import Path

          html_dir = Path("kokkos-core-wiki/docs/generated_docs")
          output_path = Path("kokkos-core-knowledge.jsonl")

          def extract_sections(html_file):
              with open(html_file, encoding="utf-8") as f:
                  soup = BeautifulSoup(f, "html.parser")
              for header in soup.select("h1, h2, h3"):
                  content = []
                  for sib in header.find_all_next():
                      if sib.name in ["h1", "h2", "h3"]:
                          break
                      content.append(sib.get_text(" ", strip=True))
                  yield {
                      "title": header.get_text(strip=True),
                      "path": str(html_file),
                      "content": "\n".join(content).strip(),
                      "source": "kokkos-core-wiki",
                      "tags": []
                  }

          with open(output_path, "w", encoding="utf-8") as fout:
              for html_file in html_dir.rglob("*.html"):
                  for section in extract_sections(html_file):
                      if section["content"]:
                          fout.write(json.dumps(section) + "\n")
          EOF

      - name: Upload JSONL Knowledge
        uses: actions/upload-artifact@v4
        with:
          name: kokkos-core-knowledge
          path: kokkos-core-knowledge.jsonl
          retention-days: 30
