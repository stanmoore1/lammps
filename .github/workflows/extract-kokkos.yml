name: Extract Kokkos Core Wiki Knowledge

on:
  workflow_dispatch:

jobs:
  extract-kokkos-core:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kokkos-core-wiki
        uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos-core-wiki
          path: kokkos-core-wiki

      - name: Checkout main repo
        uses: actions/checkout@v4
        with:
          path: main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd kokkos-core-wiki
          pip install --upgrade pip
          pip install -r build_requirements.txt
          pip install beautifulsoup4 html5lib

      - name: Build HTML docs
        run: |
          ls -l kokkos-core-wiki
          cd kokkos-core-wiki/docs || (echo "[ERROR] Missing docs dir!" && exit 1)
          make html || (echo "[ERROR] make html failed!" && exit 1)
          ls -l generated_docs

      - name: Run extraction script
        run: |
          python main/.github/workflows/extract_kokkos_core.py

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokkos-core-html
          path: kokkos-core-wiki/docs/generated_docs

      - name: Upload Knowledge JSONL
        uses: actions/upload-artifact@v4
        with:
          name: kokkos-core-knowledge
          path: kokkos-core-knowledge/lammps-gpt-kokkos.jsonl
