name: Extract Kokkos Core Wiki Knowledge

on:
  workflow_dispatch:

jobs:
  extract-kokkos-core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout kokkos-core-wiki
        uses: actions/checkout@v4
        with:
          repository: kokkos/kokkos-core-wiki
          path: kokkos-core-wiki

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd kokkos-core-wiki
          pip install --upgrade pip
          pip install -r build_requirements.txt
          pip install beautifulsoup4 html5lib

      - name: Build HTML docs
        run: |
          cd kokkos-core-wiki/docs
          make html

      - name: Convert HTML to knowledge.jsonl
        run: |
          mkdir -p kokkos-core-knowledge
          python3 -c "import os, json; from bs4 import BeautifulSoup; \
docs_dir = 'kokkos-core-wiki/docs/generated_docs'; \
output_path = 'kokkos-core-knowledge/knowledge.jsonl'; \
lines = []; \
[lines.append(json.dumps({'title': (soup.title.string.strip() if soup.title else file), 'text': body, 'source': os.path.relpath(full_path, 'kokkos-core-wiki')})) \
for root, _, files in os.walk(docs_dir) for file in files if file.endswith('.html') \
for full_path in [os.path.join(root, file)] \
for soup in [BeautifulSoup(open(full_path, encoding='utf-8'), 'html5lib')] \
for body in [soup.get_text(' ', strip=True).replace('\u200b',' ').replace('\xa0',' ')] if len(body) > 100]; \
os.makedirs('kokkos-core-knowledge', exist_ok=True); \
open(output_path, 'w', encoding='utf-8').write('\n'.join(lines))"

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: kokkos-core-html
          path: kokkos-core-wiki/docs/generated_docs

      - name: Upload Knowledge JSONL
        uses: actions/upload-artifact@v4
        with:
          name: kokkos-core-knowledge
          path: kokkos-core-knowledge/knowledge.jsonl
