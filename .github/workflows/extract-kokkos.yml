name: Extract Kokkos Knowledge

on:
  workflow_dispatch:

jobs:
  extract-kokkos:
    runs-on: ubuntu-24.04

    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base poppler-utils parallel
          pip install markdown beautifulsoup4 html5lib pypandoc PyMuPDF pdfminer.six

      - name: Clone Kokkos Documentation Repositories
        run: |
          git clone --depth=1 https://github.com/kokkos/kokkos-core-wiki.git docs_sources/kokkos-core-wiki
          git clone --depth=1 https://github.com/kokkos/kokkos-kernels.git docs_sources/kokkos-kernels
          git clone --depth=1 https://github.com/kokkos/kokkos-tutorials.git docs_sources/kokkos-tutorials

      - name: Convert RST and TeX to Markdown
        run: |
          find docs_sources \( -name "*.rst" -o -name "*.tex" \) | parallel -j4 '
            out={}.md
            pandoc -f rst -t markdown "{}" -o "$out" 2>/dev/null || true
          '

      - name: Extract and Split Markdown/PDF to JSONL
        run: |
          python3 - <<'EOF'
          import os, json, re
          from pathlib import Path
          from bs4 import BeautifulSoup
          import markdown
          import fitz  # PyMuPDF

          output_dir = Path("extracted_docs")
          output_dir.mkdir(exist_ok=True)
          out_path = output_dir / "lammps-gpt-kokkos.jsonl"

          def get_source(path):
              return str(path).split("/")[1] if "docs_sources/" in str(path) else "unknown"

          def split_markdown_sections(md_text, path):
              parts = re.split(r'^#{1,3} ', md_text, flags=re.M)
              headers = re.findall(r'^#{1,3} (.+)', md_text, flags=re.M)
              for i, content in enumerate(parts[1:], 1):
                  yield {
                      "title": headers[i - 1].strip(),
                      "path": str(path),
                      "source": get_source(path),
                      "tags": [],
                      "content": content.strip()
                  }

          def parse_markdown(path):
              with open(path, encoding="utf-8") as f:
                  raw = f.read()
              html = markdown.markdown(raw, extensions=["fenced_code", "tables"])
              soup = BeautifulSoup(html, "html.parser")
              text = soup.get_text("\n", strip=True)
              return list(split_markdown_sections(raw, path))

          def parse_pdf(path):
              doc = fitz.open(path)
              content = "\n".join(page.get_text() for page in doc)
              return [{
                  "title": path.stem,
                  "path": str(path),
                  "source": get_source(path),
                  "tags": [],
                  "content": content.strip()
              }]

          with open(out_path, "w", encoding="utf-8") as fout:
              for root, _, files in os.walk("docs_sources"):
                  for file in files:
                      try:
                          p = Path(root) / file
                          records = []
                          if file.endswith(".md"):
                              records = parse_markdown(p)
                          elif file.endswith(".pdf"):
                              records = parse_pdf(p)
                          if records:
                              for r in records:
                                  fout.write(json.dumps(r) + "\n")
                      except Exception as e:
                          print(f"Failed on {file}: {e}")

          print(f"Wrote {out_path}")
          EOF

      - name: Validate JSONL Structure
        run: |
          python3 -c '
          import json
          with open("extracted_docs/lammps-gpt-kokkos.jsonl") as f:
              for i, line in enumerate(f, 1):
                  record = json.loads(line)
                  assert "title" in record and "content" in record and "path" in record
          print("JSONL validation passed.")'

      - name: Upload JSONL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-kokkos
          path: extracted_docs/lammps-gpt-kokkos.jsonl
          retention-days: 30

      - name: Upload Raw Sources
        uses: actions/upload-artifact@v4
        with:
          name: kokkos-docs-raw
          path: docs_sources/
          retention-days: 30
