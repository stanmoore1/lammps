name: Scrape Matsci LAMMPS Forum

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Create scraper script
        run: |
          cat > scrape_forum.py << 'EOF'
          import os
          import json
          import requests
          from bs4 import BeautifulSoup

          BASE_FORUM_URL = "https://matsci.org"
          CATEGORY_SLUG = "lammps"
          CATEGORY_ID = "40"

          def get_headers():
              headers = {}
              api_key = os.getenv("DISCOURSE_API_KEY")
              api_username = os.getenv("DISCOURSE_API_USERNAME")
              if api_key and api_username:
                  headers["Api-Key"] = api_key
                  headers["Api-Username"] = api_username
              return headers

          def scrape_forum():
              category_url = f"{BASE_FORUM_URL}/c/{CATEGORY_SLUG}/{CATEGORY_ID}.json"
              headers = get_headers()
              forum_data = {"topics": []}
              response = requests.get(category_url, headers=headers)
              if response.status_code != 200:
                  print(f"Failed to get category data: {response.status_code}")
                  return forum_data
              data = response.json()
              topics = data.get("topic_list", {}).get("topics", [])
              for topic in topics:
                  topic_id = topic.get("id")
                  slug = topic.get("slug")
                  topic_url = f"{BASE_FORUM_URL}/t/{slug}/{topic_id}.json"
                  topic_response = requests.get(topic_url, headers=headers)
                  if topic_response.status_code != 200:
                      print(f"Failed to get topic {topic_id} details: {topic_response.status_code}")
                      continue
                  topic_data = topic_response.json()
                  title = topic_data.get("title", "No title")
                  post_stream = topic_data.get("post_stream", {}).get("posts", [])
                  posts = []
                  for post in post_stream:
                      raw_html = post.get("cooked", "")
                      text = BeautifulSoup(raw_html, "html.parser").get_text(separator="\n", strip=True)
                      posts.append(text)
                  forum_data["topics"].append({
                      "url": topic_url.replace(".json", ""),
                      "title": title,
                      "posts": posts
                  })
              with open("forum_data.json", "w") as f:
                  json.dump(forum_data, f, indent=2)
              return forum_data

          def notify_discord(message):
              bot_token = os.getenv("DISCORD_BOT_TOKEN")
              channel_id = os.getenv("DISCORD_CHANNEL_ID")
              if bot_token and channel_id:
                  url = f"https://discord.com/api/v10/channels/{channel_id}/messages"
                  headers = {"Authorization": f"Bot {bot_token}", "Content-Type": "application/json"}
                  data = {"content": message}
                  try:
                      response = requests.post(url, headers=headers, json=data)
                      if response.status_code not in (200, 201):
                          print("Discord API notification failed:", response.text)
                  except Exception as e:
                      print("Discord API notification failed:", e)
              else:
                  webhook_url = os.getenv("DISCORD_WEBHOOK_URL")
                  if webhook_url:
                      data = {"content": message}
                      try:
                          response = requests.post(webhook_url, json=data)
                          if response.status_code not in (200, 201):
                              print("Discord webhook notification failed:", response.text)
                      except Exception as e:
                          print("Discord webhook notification failed:", e)
                  else:
                      print("No Discord configuration provided. Skipping notification.")

          if __name__ == "__main__":
              data = scrape_forum()
              notify_discord("Forum data scraped successfully. Topics scraped: {}".format(len(data.get("topics", []))))
          EOF

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run scraper script
        run: python scrape_forum.py

      - name: Upload JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: forum_data
          path: forum_data.json
