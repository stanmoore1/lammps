name: Extract Knowledge from GitHub Repositories

on:
  workflow_dispatch:

jobs:
  extract-knowledge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Clone Required Documentation Repositories
        run: |
          mkdir docs_sources
          git clone --single-branch --depth=1 https://github.com/p12tic/cppreference-doc.git docs_sources/cppreference-doc
          git clone --single-branch --depth=1 https://github.com/kokkos/kokkos-tutorials.git docs_sources/kokkos-tutorials
          git clone --single-branch --depth=1 https://github.com/kokkos/kokkos-kernels.git docs_sources/kokkos-kernels
          git clone --single-branch --depth=1 https://github.com/kokkos/kokkos-core-wiki.git docs_sources/kokkos-core-wiki
          git clone --single-branch --depth=1 https://github.com/lammps/lammps.git docs_sources/lammps

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          pip install markdown beautifulsoup4 json5

      - name: Convert `.rst` to `.md` in Parallel
        run: |
          find docs_sources -name "*.rst" | xargs -P 4 -I {} sh -c '
            md_file="{}.md"
            pandoc -f rst -t markdown -o "$md_file" "{}"
          '

      - name: Extract and Write JSONL Knowledge Files
        run: |
          python - <<'EOF'
          import os
          import json
          import markdown
          from bs4 import BeautifulSoup
          from datetime import datetime
          from pathlib import Path

          output_dir = Path("extracted_docs")
          output_dir.mkdir(exist_ok=True)

          groups = {
              "lammps-gpt-kokkos": [
                  "docs_sources/kokkos-core-wiki",
                  "docs_sources/kokkos-tutorials",
                  "docs_sources/kokkos-kernels"
              ],
              "lammps-gpt-cppreference": [
                  "docs_sources/cppreference-doc"
              ],
              "lammps-gpt-lammps": [
                  "docs_sources/lammps"
              ]
          }

          def parse_markdown(md_text, file_path):
              html = markdown.markdown(md_text, extensions=["fenced_code", "tables"])
              soup = BeautifulSoup(html, "html.parser")
              title = soup.find("h1").get_text(strip=True) if soup.find("h1") else os.path.basename(file_path)
              sections = []
              for header in soup.find_all(["h2", "h3", "h4", "h5", "h6"]):
                  section = {"heading": header.get_text(strip=True), "level": header.name, "content": "", "code_blocks": []}
                  content_parts = []
                  next_elem = header.find_next_sibling()
                  while next_elem and next_elem.name not in ["h1", "h2", "h3", "h4", "h5", "h6"]:
                      if next_elem.name == "p":
                          content_parts.append(next_elem.get_text(strip=True))
                      elif next_elem.name in ["ul", "ol"]:
                          content_parts.append(next_elem.get_text("\n", strip=True))
                      elif next_elem.name == "pre":
                          section["code_blocks"].append(next_elem.get_text(strip=True))
                      next_elem = next_elem.find_next_sibling()
                  section["content"] = "\n\n".join(content_parts)
                  sections.append(section)
              return {
                  "title": title,
                  "path": file_path,
                  "sections": sections
              }

          for group_name, repos in groups.items():
              jsonl_path = output_dir / f"{group_name}.jsonl"
              with open(jsonl_path, "w", encoding="utf-8") as fout:
                  for repo in repos:
                      for root, _, files in os.walk(repo):
                          for file in files:
                              if file.endswith(".md"):
                                  file_path = os.path.join(root, file)
                                  with open(file_path, "r", encoding="utf-8") as f:
                                      md_text = f.read()
                                  doc = parse_markdown(md_text, file_path)
                                  fout.write(json.dumps(doc) + "\n")

          print("All JSONL files written to extracted_docs/")
          EOF

      - name: Upload Kokkos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-kokkos
          path: extracted_docs/lammps-gpt-kokkos.jsonl
          retention-days: 30

      - name: Upload CppReference Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-cppreference
          path: extracted_docs/lammps-gpt-cppreference.jsonl
          retention-days: 30

      - name: Upload LAMMPS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-lammps
          path: extracted_docs/lammps-gpt-lammps.jsonl
          retention-days: 30
