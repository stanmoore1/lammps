name: Extract LAMMPS AST

on:
  workflow_dispatch:

jobs:
  build-ast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout LAMMPS repository
        uses: actions/checkout@v4
        with:
          path: lammps

      - name: Set up Python and install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install tree-sitter tree-sitter-language-pack

      - name: Run AST extractor
        run: |
          python3 lammps/.github/workflows/extract-ast.py

      - name: Upload AST JSONL
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-ast
          path: lammps-gpt-ast.jsonl
