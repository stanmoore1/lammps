name: Build LAMMPS AST

on:
  workflow_dispatch:

jobs:
  build-ast:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up Python 3.11
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.11 python3.11-distutils python3.11-venv git gcc curl
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 1
          curl -sS https://bootstrap.pypa.io/get-pip.py | python3.11
          python3 -m pip install --upgrade pip

      - name: Install Python packages
        run: |
          python3 -m pip install tree_sitter==0.24.0 tree_sitter_languages==1.10.2

      - name: Checkout lammps repo
        uses: actions/checkout@v4
        with:
          path: lammps

      - name: Run AST parser
        run: |
          python3 lammps/.github/workflows/extract-ast.py

      - name: Upload AST JSONL
        uses: actions/upload-artifact@v4
        with:
          name: lammps-gpt-ast
          path: lammps-gpt-ast.jsonl
