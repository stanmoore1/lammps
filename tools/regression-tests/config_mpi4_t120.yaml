---
# Run the examples with 4 MPI processes, as config.yaml does, but with a 120 s
# timeout and with the step counts of the long running inputs turned down.
#
# The "-var" settings only bind where an input script defines that name as an
# index-style variable (see tools/regression-tests/parameterize_steps.py and the
# note in doc/src/variable.rst), so inputs that were never parameterized run
# unchanged.  Used together with --gen-ref this produces the reference logs that
# the KOKKOS configurations are compared against, so any accelerator run must use
# the very same "-var" settings or the number of steps will not match.
  lmp_binary: ""
  nprocs: "4"
  args: "-cite none -var nsteps 100 -var nsteps1 100 -var nsteps2 100 -var nsteps3 100 -var nsteps4 100 -var nsteps5 100 -var nsteps6 100 -var nsteps7 100 -var nequil 100 -var nprod 100 -var maxiter 100 -var maxeval 1000"
  kokkos: false
  mpiexec: "mpirun"
  mpiexec_numproc_flag: "--host localhost:4 -np"
  tolerance:
    PotEng:
      abs: 1e-4
      rel: 1e-7
    TotEng:
      abs: 1e-4
      rel: 1e-7
    Press:
      abs: 1e-4
      rel: 1e-7
    Temp:
      abs: 1e-4
      rel: 1e-7
    E_vdwl:
      abs: 1e-3
      rel: 1e-7
  overrides:
    in.rigid.tnr:
      Temp:
        abs: 1e-3
        rel: 1e-5
      Press:
        abs: 1e-2
        rel: 1e-4
  skip:
    [
      in.*pod.InP,
      in.dimer.mp,
      in.disp,
      in.disp2,
      in.dos,
      in.dpdrx-shardlow,
      in.dsring2,
      in.*_imd*,
      in.bucky-plus-cnt*,
      in.gREM,
      in.peptide-plumed,
      in.mliap.pytorch*,
      in.mliap.unified*,
      in.pod.compute,
      in.spin.iron-nve,
      in.spin.nvt_lattice,
      in.spin.nvt_spin,
      in.widom.spce,
    ]

  timeout: 120
  # input scripts in these folders must be run by the same worker in the listed
  # order, since they read files written by another input script in the folder
  # or would overwrite each other's output files
  keep_together:
    [
      PACKAGES/bocs/4_sites_LD_SG,
      PACKAGES/rhok,
      SPIN/read_restart,
    ]

  # input scripts without a reference log file cannot be checked against anything, so
  # they are only tested for not crashing, with their run commands shortened to this
  # many steps (0 or empty: run them unchanged)
  smoke_steps: 100

  nugget: 1.0
  epsilon: 1e-16


