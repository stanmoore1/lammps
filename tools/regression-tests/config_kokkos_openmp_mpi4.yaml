---
# Run the examples with the KOKKOS package on the OpenMP backend, at the same 4
# MPI processes as the CPU reference run so the same reference logs apply, with 2
# threads per process.
#
# This exists to test threading, and it is deliberately a small step away from
# config_kokkos_serial_mpi4.yaml: same ranks, same "-var" settings, same
# reference logs, same tolerances.  Everything that agrees under the Serial
# backend and disagrees here is attributable to the threads.
#
# The tolerances are left as tight as the Serial ones on purpose, even though a
# half neighbour list with more than one thread accumulates forces atomically and
# so does not reproduce bit for bit.  Loosening them to hide that would also hide
# the defects this is looking for; the sweep is triaged afterwards with
# first_row_delta.py and by differencing against the Serial results, and
# thread_determinism.py separates an order-dependent sum from a real race.
  lmp_binary: ""
  nprocs: "4"
  args: "-cite none -k on t 2 -sf kk -pk kokkos newton on neigh half -var nsteps 100 -var nsteps1 100 -var nsteps2 100 -var nsteps3 100 -var nsteps4 100 -var nsteps5 100 -var nsteps6 100 -var nsteps7 100 -var nequil 100 -var nprod 100 -var maxiter 100 -var maxeval 1000"
  kokkos: true
  mpiexec: "mpirun"
  mpiexec_numproc_flag: "--host localhost:4 -np"
  tolerance:
    PotEng:
      abs: 1e-8
      rel: 1e-10
    TotEng:
      abs: 1e-8
      rel: 1e-10
    Press:
      abs: 1e-6
      rel: 1e-10
    Temp:
      abs: 1e-8
      rel: 1e-10
    E_vdwl:
      abs: 1e-8
      rel: 1e-10
  skip:
    [
      in.*pod.InP,
      in.dimer.mp,
      in.disp,
      in.disp2,
      in.dos,
      in.dsring2,
      in.*_imd*,
      in.bucky-plus-cnt*,
      in.gREM,
      in.peptide-plumed,
      in.mliap.pytorch*,
      in.mliap.unified*,
      in.pod.compute,
      in.widom.spce,
      # these two ask query.openkim.org for a lattice constant at run time.  The
      # service answers a documented query with HTTP 200 and
      # {"error": "string indices must be integers"} after about two minutes, so
      # they cannot pass anywhere until openkim.org is fixed.  Nothing to do with
      # the code under test.
      in.kim-query,
      in.kim-pm-query.melt,
      # the only published version of the KIM simulator model this uses,
      # Sim_LAMMPS_ReaxFF_StrachanVanDuinChakraborty_2003_CHNO__SM_107643900657_000,
      # issues "pair_style reax/c" and "fix qeq/reax", both renamed in LAMMPS in
      # 2021 and removed since, so it cannot run on any current version
      in.kim-sm.melt,
      # the KOKKOS variants of these styles draw their random numbers from the
      # device generator, so their trajectories cannot match the plain styles
      in.dpdrx-shardlow,
      in.spin.iron-nve,
      in.spin.nvt_lattice,
      in.spin.nvt_spin,
      # the same, measured: pair_dpd draws its random force from RanMars while
      # pair_dpd/kk draws it from Kokkos' Random_XorShift64 pool, so the two
      # differ in the pair virial of the very first step - 6 % to 40 % of the
      # initial pressure.  Every input below either uses a dpd pair style or a
      # spin thermostat.
      in.dpd,
      in.dpd_tstat,
      in.dpdext,
      in.dpdext_tstat,
      in.dpde-vv,
      in.slater,
      in.srp,
      in.spin.restart,
    ]

  timeout: 120
  # input scripts in these folders must be run by the same worker in the listed
  # order, since they read files written by another input script in the folder
  # or would overwrite each other's output files
  keep_together:
    [
      PACKAGES/bocs/4_sites_LD_SG,
      PACKAGES/rhok,
      SPIN/read_restart,
    ]

  # input scripts without a reference log file cannot be checked against anything, so
  # they are only tested for not crashing, with their run commands shortened to this
  # many steps (0 or empty: run them unchanged)
  smoke_steps: 100

  nugget: 1.0
  epsilon: 1e-16
