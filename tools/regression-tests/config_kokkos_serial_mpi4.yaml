---
  # Run the examples through the KOKKOS package on the Serial backend with the
  # same 4 MPI processes as config_mpi4_t120.yaml, and compare against the
  # reference logs that configuration produced with --gen-ref on this machine.
  #
  # Comparing against freshly generated logs rather than the ones bundled in the
  # examples tree is what makes the tight tolerances below meaningful: the
  # bundled logs come from other machines and compilers, so the floating point
  # differences between them and a local run swamp the difference this test is
  # looking for.  With the reference produced by the same build on the same host,
  # the Serial backend does the same arithmetic in the same order as the plain
  # CPU code, and a deviation beyond roundoff points at a real difference between
  # a style and its KOKKOS variant.
  #
  # The "-var" settings must stay identical to the ones of the CPU run, or the
  # runs will have different numbers of steps and nothing will match.
  # Run the examples through the KOKKOS package on the Serial backend and
  # compare with reference log files produced by the plain styles.  The Serial
  # backend does the same arithmetic in the same order as the plain CPU code
  # in most styles, so the tolerances are much tighter than the ones of the
  # GPU and OpenMP KOKKOS configurations: a difference beyond roundoff points
  # at a real difference between a style and its KOKKOS variant.
  lmp_binary: ""
  nprocs: "4"
  args: "-cite none -k on t 1 -sf kk -var nsteps 100 -var nsteps1 100 -var nsteps2 100 -var nsteps3 100 -var nsteps4 100 -var nsteps5 100 -var nsteps6 100 -var nsteps7 100 -var nequil 100 -var nprod 100 -var maxiter 100 -var maxeval 1000"
  kokkos: true
  mpiexec: "mpirun"
  mpiexec_numproc_flag: "--host localhost:4 -np"
  tolerance:
    PotEng:
      abs: 1e-8
      rel: 1e-10
    TotEng:
      abs: 1e-8
      rel: 1e-10
    Press:
      abs: 1e-6
      rel: 1e-10
    Temp:
      abs: 1e-8
      rel: 1e-10
    E_vdwl:
      abs: 1e-8
      rel: 1e-10
  skip:
    [
      in.*pod.InP,
      in.dimer.mp,
      in.disp,
      in.disp2,
      in.dos,
      in.dsring2,
      in.*_imd*,
      in.bucky-plus-cnt*,
      in.gREM,
      in.peptide-plumed,
      in.mliap.pytorch*,
      in.mliap.unified*,
      in.pod.compute,
      in.widom.spce,
      # these two ask query.openkim.org for a lattice constant at run time.  The
      # service answers a documented query with HTTP 200 and
      # {"error": "string indices must be integers"} after about two minutes, so
      # they cannot pass anywhere until openkim.org is fixed.  Nothing to do with
      # the code under test.
      in.kim-query,
      in.kim-pm-query.melt,
      # the only published version of the KIM simulator model this uses,
      # Sim_LAMMPS_ReaxFF_StrachanVanDuinChakraborty_2003_CHNO__SM_107643900657_000,
      # issues "pair_style reax/c" and "fix qeq/reax", both renamed in LAMMPS in
      # 2021 and removed since, so it cannot run on any current version
      in.kim-sm.melt,
      # the KOKKOS variants of these styles draw their random numbers from the
      # device generator, so their trajectories cannot match the plain styles
      in.dpdrx-shardlow,
      in.spin.iron-nve,
      in.spin.nvt_lattice,
      in.spin.nvt_spin,
    ]

  timeout: 120
  # input scripts in these folders must be run by the same worker in the listed
  # order, since they read files written by another input script in the folder
  # or would overwrite each other's output files
  keep_together:
    [
      PACKAGES/bocs/4_sites_LD_SG,
      PACKAGES/rhok,
      SPIN/read_restart,
    ]

  # input scripts without a reference log file cannot be checked against anything, so
  # they are only tested for not crashing, with their run commands shortened to this
  # many steps (0 or empty: run them unchanged)
  smoke_steps: 100

  nugget: 1.0
  epsilon: 1e-16
